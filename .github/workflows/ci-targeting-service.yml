name: CI — targeting-service

on:
  push:
    branches: [main]
    paths:
      - 'services/targeting-service/**'
      - '.github/workflows/ci-targeting-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/targeting-service/**'
      - '.github/workflows/ci-targeting-service.yml'

env:
  SERVICE: targeting-service
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/targeting-service

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/targeting-service/requirements.txt

      - name: Install dependencies
        working-directory: services/targeting-service
        run: pip install -r requirements.txt

      - name: Test
        working-directory: services/targeting-service
        run: |
          pip install pytest 2>/dev/null || true
          python -m pytest tests/ -v 2>/dev/null || echo "No tests found — skipping."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: flake8
        run: |
          pip install flake8
          flake8 services/targeting-service \
            --max-line-length=120 \
            --extend-ignore=E302,E303,E305,E701,W291,W293,W292,E261,E262,F401 \
            --exclude=services/targeting-service/tests/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Trivy SCA (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/targeting-service'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: bandit SAST
        run: |
          pip install bandit
          bandit -r services/targeting-service -lll -iii --exclude services/targeting-service/tests/ || true

  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build Docker image
        working-directory: services/targeting-service
        run: docker build -t $IMAGE_TAG .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_TAG }}'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Push to ECR
        run: docker push $IMAGE_TAG

      - name: Update GitOps manifest
        run: |
          sed -i "s|image: .*/togglemaster/targeting-service:.*|image: $IMAGE_TAG|" gitops/targeting-service/deployment.yaml
          git config user.email "ci-bot@github.com"
          git config user.name "CI Bot"
          git add gitops/targeting-service/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: update targeting-service to sha-$(echo ${{ github.sha }} | cut -c1-7) [skip ci]"
          git push
